<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- fontawsome -->
    <link rel="stylesheet" href="css/fontawsome.css" />
    <!-- boostrab -->
    <link rel="stylesheet" href="css/bootstrap.css" />
    <!-- css -->
    <link rel="stylesheet" href="css/index.css" />
    <!-- media -->
    <link rel="stylesheet" href="css/media.css" />
  </head>
  <body>
    <!-- start nav -->
    <nav class="navbar navbar-expand-md bg-body-tertiary p-3 shadow-sm">
      <div class="container-fluid">
        <div class="logo-and-title d-flex gap-3 align-items-center">
          <span class="logo rounded-circle text-center fs-5 text-white"><i class="fa-solid fa-utensils"></i></span>
          <div class="title">
            <h2 class="fs-4 fw-bold">What's For Dinner</h2>
            <p class="m-0 font-14 text-muted">Your daily meal inspiration</p>
          </div>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item d-flex align-items-center">
              <span class="pe-1 fs-5"><i class="fa-solid fa-bookmark"></i></span>
              <a class="nav-link p-0" href="#saved-recepies">Saved Reciepes</a>
            </li>
            <li class="nav-item d-flex align-items-center">
              <span class="pe-1 fs-5"><i class="fa-solid fa-clock-rotate-left"></i></span>
              <a class="nav-link p-0" href="#recent">Recent</a>
            </li>
            <li class="nav-item d-flex align-items-center">
              <span class="pe-1 fs-5"><i class="fa-solid fa-gear"></i></span>
              <a class="nav-link p-0" href="#setting">Setting </a>
            </li>
            <li class="nav-item d-flex align-items-center">
              <div class="image"><img src="imgs/avatar-2.jpg" alt=" profile image" class="w-100 rounded-circle" /></div>
              <a class="nav-link p-0" href="#setting">Setting </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- End nav -->
    <!-- start main section -->
    <main>
      <section class="main-section p-3 py-5">
        <div class="container-fluid">
          <div class="row g-0">
            <div class="col-12 col-lg-5">
              <div class="inner position-relative h-100">
                <div class="img-wrapper-bigger position-relative overflow-hidden h-100">
                  <span class="reviews-pill d-flex gap-2 align-items-center rounded-pill bg-white py-2 px-3"
                    ><span class="golden-star"><i class="fa-solid fa-star"></i></span> <span class="fw-bold">4.4</span
                    ><span>(198 reviews)</span></span
                  >
                  <img src="imgs/meal-1.png" alt="meal image" class="w-100 object-fit-cover d-block" />
                </div>
                <div class="meal-desc-wrapper position-absolute rounded-4 mx-auto">
                  <div class="meal-description py-3 px-5 gap-2 d-flex rounded-3 border-gray shadow justify-content-between text-center">
                    <div class="prep-time">
                      <span class="d-block prep-time-icon fs-4"><i class="fa-solid fa-clock"></i> </span>
                      <span class="d-block">Prep Time</span>
                      <span class="d-block fw-bold">20 min</span>
                    </div>
                    <div class="cook-time">
                      <span class="d-block cook-time-icon fs-4"><i class="fa-solid fa-fire-burner"></i></span>
                      <span class="d-block">Cook Time</span>
                      <span class="d-block fw-bold">30 min</span>
                    </div>
                    <div class="serving">
                      <span class="d-block serving-icon fs-4"><i class="fa-solid fa-users"></i> </span>
                      <span class="d-block">Serving</span>
                      <span class="d-block fw-bold">4 People</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-12 col-lg-7 bg-danger">
              <div class="inner">
                <div class="rounded-3">Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque, laborum.</div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!--  js files -->
    <script src="js/bootstrap.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
